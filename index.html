<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cheers O Bar - Roleta Red Bull Dark Lite</title>
  <style>
    :root{
      --bg:#020508;
      --bg2:#07111a;
      --text:#eef3ff;
      --muted:#93a4c7;
      --line:rgba(255,255,255,.08);
      --panel:rgba(8,14,22,.84);

      --gold:#d8b11e;
      --red:#9f1738;
      --red2:#c11f45;
      --blue:#16315d;
      --blue2:#0f2445;
      --green:#0f4c47;
      --green2:#146158;
    }

    *{
      box-sizing:border-box;
      user-select:none;
      -webkit-user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }

    body{
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(18,98,87,.12), transparent 18%),
        radial-gradient(circle at 12% 18%, rgba(159,23,56,.12), transparent 22%),
        radial-gradient(circle at 88% 18%, rgba(22,49,93,.20), transparent 26%),
        linear-gradient(180deg, #000 0%, #02070d 45%, #000 100%);
      cursor:none;
    }

    .flash{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 28%),
        radial-gradient(circle at 50% 50%, rgba(20,97,88,.10), transparent 55%),
        radial-gradient(circle at 50% 50%, rgba(193,31,69,.08), transparent 72%);
      mix-blend-mode: screen;
    }

    .flash.active{
      animation: screenFlash .22s linear infinite;
    }

    .app{
      width:100vw;
      height:100vh;
      padding:12px;
      display:grid;
      grid-template-rows:auto 1fr auto;
      gap:12px;
    }

    .topbar,
    .left-panel,
    .footerbar{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding:14px 18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .mark{
      width:52px;
      height:52px;
      border-radius:50%;
      position:relative;
      background:
        radial-gradient(circle at 50% 50%, rgba(216,177,30,.95) 0 30%, transparent 31%),
        linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      border:1px solid rgba(255,255,255,.12);
      flex:0 0 auto;
    }

    .mark::before,
    .mark::after{
      content:"";
      position:absolute;
      top:20px;
      width:16px;
      height:10px;
      background:var(--red2);
      border-radius:18px 18px 4px 4px;
    }

    .mark::before{
      left:10px;
      transform:rotate(18deg);
    }

    .mark::after{
      right:10px;
      transform:rotate(-18deg);
    }

    .title small,
    .footerbar{
      display:block;
      text-transform:uppercase;
      letter-spacing:.18em;
      color:var(--muted);
      font-size:11px;
    }

    .title strong,
    .cta{
      display:block;
      text-transform:uppercase;
      line-height:1;
      font-weight:800;
      letter-spacing:.04em;
    }

    .title strong{
      font-size:clamp(22px, 1.65vw, 32px);
    }

    .cta{
      font-size:clamp(22px, 1.65vw, 32px);
      text-align:right;
      white-space:nowrap;
    }

    .main{
      min-height:0;
      display:grid;
      grid-template-columns:290px 1fr;
      gap:16px;
    }

    .left-panel{
      padding:18px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .panel-title{
      margin:0 0 14px;
      font-size:14px;
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.18em;
    }

    .prize-list{
      display:grid;
      gap:10px;
    }

    .prize-item{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px;
      border-radius:16px;
      background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.05);
      font-size:22px;
      font-weight:700;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      flex:0 0 auto;
      box-shadow:0 0 10px currentColor;
    }

    .arena{
      min-height:0;
      border-radius:32px;
      border:1px solid var(--line);
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.02), transparent 52%),
        rgba(255,255,255,.015);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }

    .wheel-stage{
      position:relative;
      width:min(72vh, 68vw, 1000px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
    }

    .pointer{
      position:absolute;
      top:-10px;
      left:50%;
      transform:translateX(-50%);
      width:0;
      height:0;
      border-left:36px solid transparent;
      border-right:36px solid transparent;
      border-top:92px solid var(--gold);
      z-index:6;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.45));
    }

    .pointer::after{
      content:"";
      position:absolute;
      left:-12px;
      top:-92px;
      width:24px;
      height:24px;
      border-radius:50%;
      background:#f6eab2;
    }

    .wheel-wrap{
      position:relative;
      width:100%;
      height:100%;
      border-radius:50%;
      padding:14px;
      background:linear-gradient(135deg, #d3d9e5, #f0f3f9 30%, #b9c0ce 60%, #d8b11e 100%);
      box-shadow:0 10px 28px rgba(0,0,0,.28);
    }

    .wheel{
      position:relative;
      width:100%;
      height:100%;
      border-radius:50%;
      overflow:hidden;
      transform:translateZ(0);
      will-change:transform;
      backface-visibility:hidden;
      transition:transform 5.6s cubic-bezier(.12,.82,.18,1);
    }

    .wheel::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:50%;
      box-shadow:inset 0 0 0 2px rgba(255,255,255,.05);
      pointer-events:none;
    }

    .slice{
      position:absolute;
      inset:0;
      transform-origin:50% 50%;
      pointer-events:none;
    }

    .slice span{
      position:absolute;
      left:68%;
      top:50%;
      width:42%;
      transform:translate(-50%, -50%) rotate(var(--counter));
      color:#f7fbff;
      font-weight:800;
      font-size:clamp(15px, 1.35vh, 24px);
      line-height:1;
      text-transform:uppercase;
      text-align:center;
      letter-spacing:.02em;
      white-space:nowrap;
      text-shadow:0 2px 5px rgba(0,0,0,.6);
    }

    .hub{
      position:absolute;
      width:17%;
      aspect-ratio:1;
      border-radius:50%;
      background:linear-gradient(180deg, #f2e7aa 0%, #cda21b 45%, #876300 100%);
      display:grid;
      place-items:center;
      z-index:4;
      border:6px solid rgba(255,255,255,.14);
      box-shadow:0 4px 10px rgba(0,0,0,.22);
    }

    .hub::after{
      content:"CHEERS";
      font-size:clamp(14px, 1vw, 22px);
      font-weight:800;
      letter-spacing:.15em;
      color:#261800;
    }

    .footerbar{
      padding:12px 16px;
      text-align:center;
    }

    @keyframes screenFlash{
      0%,100%{ opacity:0; }
      50%{ opacity:.22; }
    }

    @media (max-width: 1200px){
      .main{
        grid-template-columns:260px 1fr;
      }
    }

    @media (max-width: 980px){
      .topbar{
        flex-direction:column;
        text-align:center;
      }

      .brand{
        justify-content:center;
      }

      .cta{
        text-align:center;
        white-space:normal;
      }

      .main{
        grid-template-columns:1fr;
      }

      .wheel-stage{
        width:min(70vw, 66vh, 820px);
      }
    }

    @media (max-width: 760px){
      body{
        cursor:default;
      }

      html,body{
        overflow:auto;
      }

      .app{
        height:auto;
        min-height:100vh;
      }

      .wheel-stage{
        width:min(92vw, 56vh);
      }

      .prize-item{
        font-size:20px;
      }

      .slice span{
        width:46%;
        font-size:clamp(11px, 1.1vh, 16px);
      }
    }
  </style>
</head>
<body>
  <div class="flash" id="flash"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <div class="title">
          <small>Cheers O Bar</small>
          <strong>Roleta Red Bull</strong>
        </div>
      </div>
      <div class="cta">Pede pack ou régua e gira</div>
    </header>

    <main class="main">
      <aside class="left-panel">
        <h2 class="panel-title">Prémios</h2>
        <div class="prize-list">
          <div class="prize-item"><span class="dot" style="color:#d8b11e;background:#d8b11e"></span><span>5 shots jagger</span></div>
          <div class="prize-item"><span class="dot" style="color:#c11f45;background:#c11f45"></span><span>5 finos</span></div>
          <div class="prize-item"><span class="dot" style="color:#146158;background:#146158"></span><span>1 shot jagger</span></div>
          <div class="prize-item"><span class="dot" style="color:#2f6d67;background:#2f6d67"></span><span>1 fino</span></div>
          <div class="prize-item"><span class="dot" style="color:#355182;background:#355182"></span><span>Tenta outra vez</span></div>
        </div>
      </aside>

      <section class="arena">
        <div class="wheel-stage">
          <div class="pointer"></div>

          <div class="wheel-wrap">
            <div class="wheel" id="wheel"></div>
            <div class="hub"></div>
          </div>
        </div>
      </section>
    </main>

    <div class="footerbar">O prémio é o que estiver na seta quando a roleta parar</div>
  </div>

  <script>
    const wheel = document.getElementById('wheel');
    const flash = document.getElementById('flash');

    const segments = [
      { label: '5 SHOTS JAGGER', color: '#8d1832' },
      { label: 'TENTA OUTRA VEZ', color: '#153154' },
      { label: '5 FINOS', color: '#0f4f49' },
      { label: 'TENTA OUTRA VEZ', color: '#102949' },
      { label: '1 SHOT JAGGER', color: '#a21c3d' },
      { label: '1 FINO', color: '#146158' },
      { label: 'TENTA OUTRA VEZ', color: '#183764' }
    ];

    const segmentAngle = 360 / segments.length;
    let spinning = false;
    let totalRotation = 0;
    let spinTimeout = null;

    function norm(deg) {
      return ((deg % 360) + 360) % 360;
    }

    function buildWheel() {
      const gradient = segments.map((seg, i) => {
        const start = i * segmentAngle;
        const end = start + segmentAngle;
        return `${seg.color} ${start}deg ${end}deg`;
      }).join(',');

      wheel.style.background = `conic-gradient(from 0deg, ${gradient})`;
      wheel.innerHTML = '';

      for (let i = 0; i < segments.length; i++) {
        const centerAngle = i * segmentAngle + segmentAngle / 2;

        const slice = document.createElement('div');
        slice.className = 'slice';
        slice.style.transform = `rotate(${centerAngle}deg)`;

        const span = document.createElement('span');
        span.innerHTML = segments[i].label;
        span.style.setProperty('--counter', `${-centerAngle}deg`);

        slice.appendChild(span);
        wheel.appendChild(slice);
      }
    }

    function targetRotationForIndex(index) {
      const current = norm(totalRotation);
      const centerAngle = index * segmentAngle + segmentAngle / 2;
      const target = norm(360 - centerAngle);
      const delta = norm(target - current);
      const extraTurns = (6 + Math.floor(Math.random() * 2)) * 360;
      return totalRotation + extraTurns + delta;
    }

    function endSpin() {
      if (!spinning) return;
      spinning = false;
      flash.classList.remove('active');
      if (spinTimeout) {
        clearTimeout(spinTimeout);
        spinTimeout = null;
      }
    }

    function spin() {
      if (spinning) return;
      spinning = true;

      const index = Math.floor(Math.random() * segments.length);
      totalRotation = targetRotationForIndex(index);

      flash.classList.add('active');
      wheel.style.transform = `translateZ(0) rotate(${totalRotation}deg)`;

      if (spinTimeout) clearTimeout(spinTimeout);
      spinTimeout = setTimeout(endSpin, 5900);
    }

    wheel.addEventListener('transitionend', endSpin);

    buildWheel();

    window.addEventListener('keydown', spin, { passive: true });
    document.addEventListener('mousedown', spin, { passive: true });
    document.addEventListener('touchstart', spin, { passive: true });
  </script>
</body>
</html>
