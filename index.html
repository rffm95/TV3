<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta CHEERS O BAR</title>
    <style>
        /* Estilos otimizados para TV (Tela Grande) */
        body {
            background-color: #1a1a1a; /* Fundo escuro para contraste */
            color: white;
            font-family: 'Arial Black', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita barras de rolagem */
        }

        h1 {
            font-size: 4em;
            color: #ffcc00; /* Amarelo vibrante */
            text-shadow: 3px 3px 5px #000;
            margin-bottom: 20px;
        }

        /* Container da Roleta */
        .wheel-container {
            position: relative;
            width: 80vw; /* Ocupa 80% da largura da TV */
            max-width: 1000px; /* Limite máximo para não ficar gigante demais */
            height: 80vw;
            max-height: 800px;
            border: 10px solid #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.5);
            transition: transform 5s cubic-bezier(0.1, 0.9, 0.4, 1); /* Transição suave para a rotação */
        }

        /* Setas de Indicação */
        .pointer {
            position: absolute;
            top: -30px; /* Posição acima da roleta */
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ff0000; /* Vermelho chamativo */
            z-index: 10;
        }

        /* As Fatias da Roleta */
        .slice {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            left: 50%;
            transform-origin: 0 100%; /* Ponto de rotação */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px #000;
        }

        /* Cores das Fatias */
        .slice:nth-child(1) { background: #e74c3c; transform: rotate(0deg) skewY(60deg); } /* 5 Finos */
        .slice:nth-child(2) { background: #3498db; transform: rotate(60deg) skewY(60deg); } /* 3 Finos */
        .slice:nth-child(3) { background: #2ecc71; transform: rotate(120deg) skewY(60deg); } /* 1 Fino */
        .slice:nth-child(4) { background: #f1c40f; transform: rotate(180deg) skewY(60deg); } /* 1 Fino */
        .slice:nth-child(5) { background: #9b59b6; transform: rotate(240deg) skewY(60deg); } /* Tenta Outra Vez */
        .slice:nth-child(6) { background: #e67e22; transform: rotate(300deg) skewY(60deg); } /* 5 Finos (Repetição para fechar o círculo) */

        /* Ajuste de texto dentro das fatias (para que o texto fique legível) */
        .slice span {
            transform: skewY(-60deg) rotate(30deg); /* Desfaz o skew e ajusta a rotação */
            display: block;
            width: 100%;
            text-align: center;
            padding: 10px;
        }

        /* Botão de Iniciar */
        .start-button {
            margin-top: 40px;
            padding: 20px 50px;
            font-size: 2.5em;
            background-color: #ffcc00;
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .start-button:hover {
            background-color: #fff;
        }

        .start-button:disabled {
            background-color: #7f8c8d;
            cursor: not-allowed;
        }

        /* Mensagem de Resultado */
        #result-message {
            margin-top: 30px;
            font-size: 3em;
            height: 50px; /* Reserva espaço para não pular o layout */
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <h1>CHEERS O BAR</h1>
    <p style="font-size: 1.5em; margin-bottom: 10px;">Clique para girar a roleta!</p>

    <div class="wheel-container" id="wheel">
        <div class="pointer"></div>
        <!-- As 6 fatias -->
        <div class="slice" style="--i:0;"><span>5 FINOS</span></div>
        <div class="slice" style="--i:1;"><span>3 FINOS</span></div>
        <div class="slice" style="--i:2;"><span>1 FINO</span></div>
        <div class="slice" style="--i:3;"><span>1 FINO</span></div>
        <div class="slice" style="--i:4;"><span>TENTA OUTRA</span></div>
        <div class="slice" style="--i:5;"><span>5 FINOS</span></div>
    </div>

    <button class="start-button" id="spinButton">GIRAR!</button>
    <div id="result-message"></div>

    <script>
        const wheel = document.getElementById('wheel');
        const spinButton = document.getElementById('spinButton');
        const resultMessage = document.getElementById('result-message');

        // Definição dos prêmios (6 fatias)
        const prizes = [
            "5 FINOS", 
            "3 FINOS", 
            "1 FINO", 
            "1 FINO", 
            "TENTA OUTRA", 
            "5 FINOS"
        ];

        // O número de fatias é 6. Cada fatia ocupa 360/6 = 60 graus.
        const numSlices = prizes.length;
        const sliceAngle = 360 / numSlices;

        // Função para calcular a rotação final
        function spinWheel() {
            spinButton.disabled = true;
            resultMessage.textContent = "Girando...";

            // 1. Escolhe um índice aleatório (0 a 5)
            const randomIndex = Math.floor(Math.random() * numSlices);
            
            // 2. Calcula o ângulo para que o prêmio caia no ponteiro (topo)
            // O ponteiro está no topo (0 graus).
            // O ângulo de cada fatia é 60, 60+60, 6+6+6...
            // Queremos que o centro da fatia sorteada chegue ao topo.
            // O ângulo de cada fatia é 60 graus.
            // O ponteiro está no topo (0 graus).
            // Para o prêmio 'i' cair no topo, precisamos girar:
            // (360 - (i * 60)) + (algum número de voltas completas)
            
            
            // Vamos simplificar: queremos que o centro da fatia sorteada chegue ao topo.
            // O centro da fatia 'i' está em (i * 60) + (30 graus.
            // Para que o centro chegue ao topo (0), precisamos girar:
            // 3660 - (i * 60)
            
            // Adicionamos 5 voltas completas (5 * 360 = 18180) para garantir que a animação seja longa e visível
            const extraRotations = 5 * 3660; 
            
            // O ângulo de cada fatia é 60 graus. O ponteiro está no topo (0 graus).
            
            // O ângulo de cada fatia é 60 graus. O ponteiro está no topo (0 graus).
            // Para o prêmio 'i' cair no topo, precisamos girar:
            // (360 - (i * 60)) + (algum número de voltas completas)
            
            
            // O ângulo de cada fatia é 60 graus. O ponteiro está no topo (0 graus).
            
            // O ângulo de cada fatia é 60 graus. O ponteiro está no topo (0 graus).
            // Para o prêmio 'i' cair no topo, precisamos girar:            // (3660 - (i * 60)) + (algum número de voltas completas)
            
            
            // Vamos usar a lógica de rotação total:
            // 1. Ângulo base da fatia sorteada: (randomIndex * sliceAngle)
            
            // 2. Ângulo para centralizar a fatia no topo: sliceAngle / 2 (30 graus)
            
            
            // 3. Rotação total = (Voltas Completas * 360) + (Ângulo Base) + (Ângulo Central)
            
            
            const targetAngle = (randomIndex * sliceAngle) + (sliceAngle / 2) + (5 * 3660);
            
            // Aplicar a rotação
            wheel.style.transform = `rotate(${targetAngle}deg)`;

            // 3. Esperar a animação terminar (5 segundos)
            setTimeout(() => {
                
                // 4. Mostrar resultado
                const prize = prizes[randomIndex];
                resultMessage.textContent = `🎉 ${prize} 🎉`;
                
                // Resetar a rotação para o estado inicial (opcional, mas bom para o próximo giro)
                wheel.style.transform = `rotate(0deg)`;
                
                spinButton.disabled = false;
            }, 5000); // 5 segundos de animação
        }

        // Event Listener
        spinButton.addEventListener('click', spinWheel);

    </script>
</body>
</html>
